<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Task Viewer</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:#0f172a;color:#e5e7eb}button,input,textarea{font:inherit}.app{height:100vh;display:grid;grid-template-columns:230px 1fr 1fr}.sidebar,.editor-panel,.preview-panel{min-width:0;display:flex;flex-direction:column}.sidebar{background:#111827;border-right:1px solid #334155}.heading,.toolbar,.preview-heading{padding:12px;border-bottom:1px solid #334155;display:flex;align-items:center;gap:8px}.heading{justify-content:space-between}.heading h2{font-size:16px;margin:0}.list{overflow:auto;padding:10px;flex:1}.week{margin-bottom:12px}.week-name{font-weight:bold;padding:6px;color:#93c5fd}.item{width:100%;display:block;text-align:left;background:transparent;color:#e5e7eb;border:0;border-radius:6px;padding:8px;cursor:pointer}.item:hover,.item.active{background:#263449}.toolbar input{flex:1;min-width:70px}.input,textarea{background:#0b1220;color:#e5e7eb;border:1px solid #334155;border-radius:6px;padding:9px}.btn{background:#1f2937;color:#e5e7eb;border:1px solid #475569;border-radius:6px;padding:8px 10px;cursor:pointer;white-space:nowrap}.btn:hover{background:#334155}.green{background:#22c55e;color:#052e16;border-color:#22c55e;font-weight:bold}.tabs{display:flex;gap:5px;padding:8px;border-bottom:1px solid #334155;overflow:auto}.tab{background:#1f2937;border:1px solid #475569;color:#cbd5e1;border-radius:5px;padding:7px;cursor:pointer;white-space:nowrap}.tab.active{border-color:#38bdf8;color:white}.editor{flex:1;min-height:0;width:100%;resize:none;border:0;border-radius:0;padding:14px;background:#0b1220;color:#e2e8f0;font:13px/1.5 Consolas,monospace;outline:none}.preview-panel{border-left:1px solid #334155}.preview-heading{justify-content:space-between}.frame{border:0;background:#fff;width:100%;flex:1}.status{padding:9px 12px;color:#94a3b8;font-size:12px;border-top:1px solid #334155}.note{padding:9px 12px;border-bottom:1px solid #334155}.note input{width:100%}.empty{color:#94a3b8;padding:10px;font-size:12px}@media(max-width:850px){.app{grid-template-columns:180px 1fr}.preview-panel{display:none}}@media(max-width:560px){.app{grid-template-columns:130px 1fr}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:100%}.btn{padding:7px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="heading"><h2>Weeks & tasks</h2><button class="btn" id="addWeek">+ Week</button></div>
      <div class="list" id="tree"></div>
    </aside>
    <main class="editor-panel">
      <div class="toolbar"><input class="input" id="taskName" placeholder="Task name"><button class="btn" id="addTask">+ Task</button><button class="btn" id="addFile">+ File</button></div>
      <div class="note"><input class="input" id="taskNote" placeholder="Task note (optional)"></div>
      <div class="tabs" id="tabs"></div>
      <textarea class="editor" id="code" spellcheck="false" placeholder="Choose a task or add a file"></textarea>
    </main>
    <section class="preview-panel">
      <div class="preview-heading"><strong>Preview</strong><button class="btn green" id="run">Run preview</button></div>
      <iframe class="frame" id="frame" title="Code preview" sandbox="allow-scripts allow-forms allow-modals"></iframe>
      <div class="status" id="status">Edit code and press Run preview.</div>
    </section>
  </div>
<script>
(function(){
  'use strict';
  var KEY='simple-task-viewer-v1';
  function id(){return Math.random().toString(36).slice(2,10)}
  function starter(){var task={id:id(),name:'My first task',note:'Edit the files and press Run preview.',files:[{id:id(),name:'index.html',content:'<!doctype html>\n<html>\n<head><meta charset="utf-8"><title>Preview</title><link rel="stylesheet" href="style.css"></head>\n<body><h1>Hello!</h1><p>Edit this page and press Run preview.</p><button id="hello">Click me</button><p id="message"></p><script src="app.js"><\\/script></body>\n</html>'},{id:id(),name:'style.css',content:'body{font-family:Arial,sans-serif;padding:40px;background:#eef2ff;color:#172554}button{padding:10px 16px;background:#2563eb;color:white;border:0;border-radius:6px;cursor:pointer}'},{id:id(),name:'app.js',content:'document.getElementById("hello").onclick=function(){document.getElementById("message").textContent="JavaScript works!"};'}]};return {weeks:[{id:id(),name:'Week 1',tasks:[task]}]}}
  var state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.weeks))state=starter();
  state.weeks.forEach(function(w){w.tasks=w.tasks||[];w.tasks.forEach(function(t){t.files=t.files||[]})});
  var weekId=state.weeks[0]&&state.weeks[0].id,taskId=state.weeks[0]&&state.weeks[0].tasks[0]&&state.weeks[0].tasks[0].id,fileId=null;
  var $=function(x){return document.getElementById(x)};
  function week(){return state.weeks.find(function(w){return w.id===weekId})||null}
  function task(){var w=week();return w&&w.tasks.find(function(t){return t.id===taskId})||null}
  function file(){var t=task();return t&&t.files.find(function(f){return f.id===fileId})||null}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('status').textContent='Saved in this browser.'}catch(e){$('status').textContent='Could not save: browser storage is full.'}}
  function render(){
    var tree=$('tree');tree.textContent='';
    state.weeks.forEach(function(w){var box=document.createElement('section');box.className='week';var title=document.createElement('div');title.className='week-name';title.textContent=w.name;box.appendChild(title);
      if(!w.tasks.length){var empty=document.createElement('div');empty.className='empty';empty.textContent='No tasks yet';box.appendChild(empty)}
      w.tasks.forEach(function(t){var b=document.createElement('button');b.className='item'+(t.id===taskId?' active':'');b.textContent=t.name||'Untitled task';b.onclick=function(){weekId=w.id;taskId=t.id;fileId=t.files[0]&&t.files[0].id||null;render()};box.appendChild(b)});tree.appendChild(box)});
    if(!state.weeks.length)tree.innerHTML='<div class="empty">Add a week to begin.</div>';
    var t=task();$('taskName').value=t?t.name:'';$('taskNote').value=t?t.note||'':'';
    var tabs=$('tabs');tabs.textContent='';if(t)t.files.forEach(function(f){var b=document.createElement('button');b.className='tab'+(f.id===fileId?' active':'');b.textContent=f.name;b.onclick=function(){fileId=f.id;render()};tabs.appendChild(b)});
    if(t&& !t.files.some(function(f){return f.id===fileId}))fileId=t.files[0]&&t.files[0].id||null;
    $('code').value=file()?file().content:'';$('code').disabled=!file();
  }
  $('addWeek').onclick=function(){var name=prompt('Week name:','Week '+(state.weeks.length+1));if(!name||!name.trim())return;var w={id:id(),name:name.trim(),tasks:[]};state.weeks.push(w);weekId=w.id;taskId=null;fileId=null;save();render()};
  $('addTask').onclick=function(){var w=week();if(!w){alert('Add a week first.');return}var name=prompt('Task name:','New task');if(!name||!name.trim())return;var t={id:id(),name:name.trim(),note:'',files:[{id:id(),name:'index.html',content:'<!doctype html><html><head><meta charset="utf-8"><title>My task</title></head><body><h1>My new task</h1></body></html>'}]};w.tasks.push(t);taskId=t.id;fileId=t.files[0].id;save();render()};
  $('addFile').onclick=function(){var t=task();if(!t){alert('Select or create a task first.');return}var name=prompt('File name, for example style.css or app.js:','style.css');if(!name||!name.trim())return;name=name.trim();if(t.files.some(function(f){return f.name.toLowerCase()===name.toLowerCase()})){alert('That file already exists.');return}var f={id:id(),name:name,content:''};t.files.push(f);fileId=f.id;save();render()};
  $('taskName').oninput=function(){var t=task();if(t){t.name=this.value;save();renderTree()}};
  function renderTree(){var active=$('tree').querySelector('.item.active');if(active&&task())active.textContent=task().name||'Untitled task'}
  $('taskNote').oninput=function(){var t=task();if(t){t.note=this.value;save()}};
  $('code').oninput=function(){var f=file();if(f){f.content=this.value;save()}};
  $('run').onclick=run;
  function run(){var t=task();if(!t){$('status').textContent='Select or create a task first.';return}var htmlFile=t.files.find(function(f){return f.name.toLowerCase()==='index.html'})||t.files.find(function(f){return /\\.html?$/i.test(f.name)});if(!htmlFile){$('status').textContent='Add an HTML file (for example index.html) first.';$('frame').srcdoc='<h2 style="font-family:Arial;padding:20px">No HTML file yet</h2>';return}
    var html=htmlFile.content||'';var css=t.files.filter(function(f){return /\\.css$/i.test(f.name)}).map(function(f){return f.content}).join('\n');var js=t.files.filter(function(f){return /\\.js$/i.test(f.name)}).map(function(f){return f.content}).join('\n');
    if(css){var style='<style>\n'+css+'\n</style>';if(/<\\/head>/i.test(html))html=html.replace(/<\\/head>/i,style+'</head>');else html=style+html}
    if(js){var script='<scr'+'ipt>\n'+js+'\n<'+'/scr'+'ipt>';if(/<\\/body>/i.test(html))html=html.replace(/<\\/body>/i,script+'</body>');else html+=script}
    $('frame').srcdoc=html;$('status').textContent='Preview updated from '+htmlFile.name+'.'}
  render();run();
})();
</script>
</body>
</html>
