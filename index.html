<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Coursework Tracker | Muhammadmuso</title>
  <style>
    :root{color-scheme:dark;--page:#101827;--panel:#172337;--panel2:#1d2b41;--ink:#f3f6fb;--muted:#a9b5c7;--line:#34445c;--accent:#ffbd59;--cyan:#7cdece;--danger:#ff8b87}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 0%,#253656 0,transparent 36rem),var(--page);color:var(--ink);font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(1120px,100% - 32px);margin:0 auto;padding:40px 0 64px}
    .masthead{padding:clamp(24px,5vw,46px);border:1px solid var(--line);border-radius:26px;background:linear-gradient(125deg,#1d2b41,#142033)}
    .eyebrow{margin:0 0 12px;color:var(--cyan);font-size:.75rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.04;letter-spacing:-.055em}
    .intro{max-width:65ch;margin:16px 0 0;color:#d0d9e7}
    .toolbar{display:flex;gap:12px;align-items:center;margin:24px 0}
    .toolbar input{flex:1;min-width:0;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--ink);font:inherit}
    .summary{color:var(--muted);font-size:.9rem;white-space:nowrap}
    .weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:18px;align-items:start}
    .week{overflow:hidden;border:1px solid var(--line);border-radius:19px;background:linear-gradient(180deg,var(--panel),#141f30);box-shadow:0 12px 30px #03081145}
    .week-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);background:#ffffff05}
    .week-head h2{margin:0;font-size:1.25rem;letter-spacing:-.025em}
    .badge{padding:5px 9px;border-radius:999px;background:#ffbd5918;color:var(--accent);font-size:.75rem;font-weight:800;white-space:nowrap}
    .tasks{display:grid;gap:1px;background:var(--line)}
    .task{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 16px;background:var(--panel)}
    .number{display:grid;width:32px;height:32px;place-items:center;border:1px solid var(--line);border-radius:10px;color:var(--cyan);font-size:.72rem;font-weight:800}
    .task-title{display:block;overflow-wrap:anywhere;font-weight:700}
    .task-path{display:block;margin-top:2px;color:var(--muted);font-size:.76rem;overflow-wrap:anywhere}
    button{padding:8px 11px;border:1px solid #ffbd5950;border-radius:10px;background:transparent;color:var(--accent);font:inherit;font-size:.82rem;font-weight:800;cursor:pointer}
    button:hover{background:#ffbd5918}
    button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
    .viewer{grid-column:1/-1;min-width:0;margin-top:5px;border:1px solid var(--line);border-radius:12px;background:#0b1220;overflow:hidden}
    .viewer-toolbar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);background:#ffffff08}
    .viewer-toolbar button{padding:6px 10px;font-size:.75rem}
    .viewer-toolbar button[aria-pressed="true"]{background:#ffbd5918}
    .viewer-label{margin-left:auto;color:var(--muted);font-size:.72rem}
    .source{max-height:520px;overflow:auto;margin:0;padding:16px;color:#dce7f5;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
    .preview{display:block;width:100%;height:min(70vh,620px);min-height:300px;border:0;background:#fff}
    .empty{grid-column:1/-1;padding:32px;text-align:center;color:var(--muted)}
    footer{margin-top:28px;color:var(--muted);font-size:.85rem;text-align:center}
    @media(max-width:620px){main{width:min(100% - 22px,1120px);padding-top:22px}.masthead{border-radius:20px}.toolbar{align-items:stretch;flex-direction:column}.summary{white-space:normal}.task{grid-template-columns:32px minmax(0,1fr)}.task button{grid-column:2;justify-self:start}}
  </style>
</head>
<body>
  <main>
    <header class="masthead">
      <p class="eyebrow">Web programming · coursework archive</p>
      <h1>Every week.<br>Every task.</h1>
      <p class="intro">Browse your coursework weeks and preview saved files here. HTML and SVG files render in an isolated preview, and every file keeps a source view.</p>
    </header>
    <div class="toolbar">
      <input id="filter" type="search" placeholder="Filter by week, task, or file…" aria-label="Filter coursework">
      <span class="summary" id="summary" role="status">Loading coursework…</span>
    </div>
    <div class="weeks" id="weeks" aria-live="polite"></div>
    <footer>Coursework Tracker · Muhammadmuso · Student ID 202637351</footer>
  </main>
  <script>
    const weeksRoot = document.getElementById("weeks");
    const summary = document.getElementById("summary");
    const filter = document.getElementById("filter");
    let groups = [];

    function getWeekFiles(group) {
      const files = [];
      for (const task of group.tasks || []) {
        for (const file of task.files || []) {
          const name = file.name || file.path || file.filename || "Unnamed file";
          files.push({ name, code: file.code || "", task: task.text || "", id: file.id || name });
        }
      }
      return files;
    }

    function canPreview(file) {
      return /\.(html?|svg)$/i.test(file.name.split(/[?#]/)[0]);
    }

    function render() {
      const query = filter.value.trim().toLowerCase();
      weeksRoot.replaceChildren();
      let visibleFiles = 0;
      let visibleWeeks = 0;

      for (const group of groups) {
        const files = getWeekFiles(group).filter(file => `${group.title || ""} ${file.task} ${file.name}`.toLowerCase().includes(query));
        if (!files.length) continue;
        visibleWeeks++;
        visibleFiles += files.length;
        const section = document.createElement("section");
        section.className = "week";
        const head = document.createElement("div");
        head.className = "week-head";
        const title = document.createElement("h2");
        title.textContent = group.title || group.id || "Coursework";
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = `${files.length} files`;
        head.append(title, badge);

        const list = document.createElement("div");
        list.className = "tasks";
        files.forEach((file, index) => {
          const row = document.createElement("article");
          row.className = "task";
          const number = document.createElement("span");
          number.className = "number";
          number.textContent = String(index + 1).padStart(2, "0");
          const details = document.createElement("span");
          const label = document.createElement("span");
          label.className = "task-title";
          label.textContent = file.name;
          const path = document.createElement("span");
          path.className = "task-path";
          path.textContent = file.task;
          details.append(label, path);

          const button = document.createElement("button");
          button.type = "button";
          button.textContent = "View file";
          button.setAttribute("aria-expanded", "false");
          button.addEventListener("click", () => {
            const existing = row.querySelector(".viewer");
            if (existing) {
              existing.remove();
              button.textContent = "View file";
              button.setAttribute("aria-expanded", "false");
              return;
            }
            const viewer = document.createElement("div");
            viewer.className = "viewer";
            const toolbar = document.createElement("div");
            toolbar.className = "viewer-toolbar";
            const content = document.createElement("div");
            const modes = canPreview(file) ? ["preview", "source"] : ["source"];
            const showMode = mode => {
              content.replaceChildren();
              if (mode === "preview") {
                const frame = document.createElement("iframe");
                frame.className = "preview";
                frame.title = `Rendered preview of ${file.name}`;
                frame.setAttribute("sandbox", "allow-scripts");
                frame.srcdoc = file.code;
                content.append(frame);
              } else {
                const pre = document.createElement("pre");
                pre.className = "source";
                pre.textContent = file.code || "No saved file content.";
                content.append(pre);
              }
              toolbar.querySelectorAll("button[data-mode]").forEach(control => control.setAttribute("aria-pressed", String(control.dataset.mode === mode)));
            };
            for (const mode of modes) {
              const control = document.createElement("button");
              control.type = "button";
              control.dataset.mode = mode;
              control.textContent = mode === "preview" ? "Preview" : "Source";
              control.setAttribute("aria-pressed", "false");
              control.addEventListener("click", () => showMode(mode));
              toolbar.append(control);
            }
            const close = document.createElement("button");
            close.type = "button";
            close.textContent = "Close";
            close.addEventListener("click", () => {
              viewer.remove();
              button.textContent = "View file";
              button.setAttribute("aria-expanded", "false");
              button.focus();
            });
            toolbar.append(close);
            const label = document.createElement("span");
            label.className = "viewer-label";
            label.textContent = file.name;
            toolbar.append(label);
            viewer.append(toolbar, content);
            row.append(viewer);
            showMode(modes[0]);
            button.textContent = "Close file";
            button.setAttribute("aria-expanded", "true");
          });
          row.append(number, details, button);
          list.append(row);
        });
        section.append(head, list);
        weeksRoot.append(section);
      }

      summary.textContent = `${visibleFiles} coursework files · ${visibleWeeks} weeks`;
      if (!visibleFiles) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = query ? "No matching tasks. Try another search." : "No coursework files found.";
        weeksRoot.append(empty);
      }
    }

    filter.addEventListener("input", render);
    fetch("./data%20(3).json", { cache: "no-store" })
      .then(response => {
        if (!response.ok) throw new Error(`Could not load coursework data (HTTP ${response.status})`);
        return response.json();
      })
      .then(data => {
        groups = Array.isArray(data.weeks) ? data.weeks : [];
        if (!groups.length) throw new Error("No coursework weeks were found in the data file.");
        render();
      })
      .catch(error => {
        summary.textContent = "Coursework could not be loaded";
        const message = document.createElement("p");
        message.className = "empty";
        message.textContent = `${error.message}. Make sure data (3).json remains in the repository, then reload.`;
        weeksRoot.replaceChildren(message);
      });
  </script>
</body>
</html>
